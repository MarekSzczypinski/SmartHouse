apiVersion: 1
policies:
  - orgId: 1
    receiver: TextMe  # Default receiver
    group_by: ['location', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - matchers:
          - severity = critical
        group_wait: 10s  # Faster for critical
        repeat_interval: 1h
      - matchers:
          - severity = warning
        repeat_interval: 6h  # Less frequent for warnings
