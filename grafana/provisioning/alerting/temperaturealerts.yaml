apiVersion: 1
groups:
- orgId: 1
  name: TemperatureAlerts
  folder: SmartHouse
  interval: 1m
  rules:
    - uid: efcpfwly3ym80f
      title: TemperatureWarning
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: influxdb-sensors-1
          model:
            intervalMs: 1000
            maxDataPoints: 43200
            query: |-
                from(bucket: "sensors")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r["_measurement"] == "sensor_measurement")
                  |> filter(fn: (r) => r["_field"] == "temperature")
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                        - B
                  reducer:
                    params: []
                    type: last
                  type: query
            datasource:
                type: __expr__
                uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
                - evaluator:
                    params:
                        - 20
                        - 26
                    type: outside_range
                  operator:
                    type: and
                  query:
                    params:
                        - C
                  reducer:
                    params: []
                    type: last
                  type: query
            datasource:
                type: __expr__
                uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 5m
      annotations:
        description: '{{ $temp := $values.B.Value }}Temperature {{ printf "%.1f" $temp }}°C in {{ $labels.location }}'
        summary: |-
            {{ $temp := $values.B.Value }}
            {{- if (lt $temp 20.0) -}}
            Low
            {{- else if (gt $temp 26.0) -}}
            High
            {{- end }} Temperature Detected
      labels:
        measurement: temperature
        severity: warning
      isPaused: false
